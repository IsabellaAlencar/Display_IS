<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @Media</title>

    <!-- Estilos da página -->
    <style>



        body {
            background-color: blue;
        }
        
        .container{
            width: 100%;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .box{
            width: 400px;
            height: 200px;
            background-color: rgb(0, 47, 148);
        }

        @media (min-width: 768px){
            body{
                background-color: cornflowerblue;
            }
        }
        
        @media (max-width: 480px)   {
            body {
                background-color: lightgreen;
            }
        }
    </style>
</head>

<body>
    <h1> Testes com CSS @Media Query </h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
