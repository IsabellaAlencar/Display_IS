<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @Media</title>

    <!-- Estilos da página -->
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


       

        h1{
            text-align: center;
            margin-bottom: 20px;
        }


        
        .container{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }


        .box{
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: rgb(0, 0, 0);
        }
        
        .container-position{
            margin-top: 10px;
            width: 100%;
            height: 600px;
            border: 2px solid blueviolet;
            position: relactive;
        }


        .filho-tamanho{
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: rgb(97, 97, 172);
        }


        .container-position__filho01{
            top: 0;
            right: 0;
        }


        .container-position__filho02{
            top: 0;
            right: 0;
        }

        .container-position__filho03{
            bottom: 0;
            left: 0;
        }



        .container-position__filho04{
            bottom: 0;
            right: 0;
        }

        .whats{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(42, 173, 3);
            border: 2px solid #fff;
            box-shadow: 1px 2px 2px #fff;
            position: fixed;
            right: 0;
            bottom: 0;
        }


        .whats img{
            width: 75;
            left: 75;

        }


        @media (min-width: 1270px){
            body{
                background-color: rgb(169, 61, 179);
            }

            box{
                width: 45%;
                max-width: 600px;
            }
        }
        
        @media (max-width: 854px)   {
            body {
                background-color: rgb(120, 42, 209);

            box{
                width: 300px;
            }
            }
        }

         body {
            padding: 20px;
            background-color: blue;
            color: white;
            font-family: Arial, sans-serif;
            height: 300vh;
        }

    </style>
</head>

<body>
    <h1>Testes com CSS @Media Query</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">
        <div class="container-position__filho01 filho-tamanho"></div>
        <div class="container-position__filho02 filho-tamanho"></div>
        <div class="container-position__filho03 filho-tamanho"></div>
        <div class="container-position__filho04 filho-tamanho"></div>

    </div>
    <div class="whats">
        <img src="./css/apple.png" alt="Logo Whatssap">

    </div>
</body>

</html>
