<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @Media</title>

    <!-- Estilos da página -->
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background-color: blue;
        }

        @media (min-width: 768px){
            body{
                background-color: cornflowerblue;
            }
        }
        
        @media (max-width: 480px)   {
            body {
                background-color: lightgreen;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
